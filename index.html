<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Glassmorphism System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-container"></div>
    <div class="overlay"></div>

    <div id="settings-toggle" class="settings-icon"><i class="fas fa-cog"></i></div>

    <div id="settings-menu" class="side-menu">
        <div class="menu-header">
            <h3>Settings</h3>
            <i class="fas fa-times close-menu"></i>
        </div>
        <div class="menu-body">
            <label>Wallpaper (Photo/Video)</label>
            <input type="file" id="wallpaper-input" accept="image/*,video/*">
            <div class="button-group">
                <button id="save-bg" class="neon-btn">Save</button>
                <button id="reset-bg" class="neon-btn">Reset</button>
            </div>
        </div>
    </div>

    <div id="auth-container" class="glass-box">
        <form id="login-form">
            <h2>LOGIN</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="login-user" required placeholder=" ">
                <label>Username</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-pass" required placeholder=" ">
                <label>Password</label>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
            <p class="toggle-text">New here? <span id="go-to-register">Create Account</span></p>
        </form>

        <form id="register-form" style="display: none;">
            <h2>REGISTER</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="reg-user" required placeholder=" ">
                <label>Username</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="reg-pass" required placeholder=" ">
                <label>Password</label>
            </div>
            <button type="submit" class="auth-btn">Register</button>
            <p class="toggle-text">Have an account? <span id="go-to-login">Login</span></p>
        </form>
    </div>

    <div id="main-interface" class="interface-container" style="display: none;">
        <div class="chat-header">
            <i id="hide-chat" class="fas fa-eye"></i>
        </div>
        <div id="chat-box" class="chat-display">
            <div class="bot-msg">Welcome! I am your AI Search bot. How can I help?</div>
        </div>
        <div class="input-area">
            <input type="text" id="search-input" placeholder="Search anything (YouTube, TikTok, Google)...">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
